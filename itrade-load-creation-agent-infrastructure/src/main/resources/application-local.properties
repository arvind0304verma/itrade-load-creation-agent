# Static version for local runs (base uses @project.version@, which is only
# resolved by Maven resource filtering and shows up literally when IntelliJ
# runs from unfiltered classes). Stamped into logs via the shared logback config.
app.version=local

# Local runs have no GCP environment. The shared kernel pulls in Spring Cloud
# GCP, whose Pub/Sub autoconfiguration eagerly creates a TopicAdminClient that
# needs real Application Default Credentials at startup. Nothing in this app or
# the shared kernel injects PubSubTemplate/PubSubAdmin, so disable Pub/Sub
# autoconfig locally. The project id is a harmless placeholder for GcpContext.
spring.cloud.gcp.project-id=local-dev
spring.cloud.gcp.pubsub.enabled=false

# Local-only auth bypass. TokenAuthenticationFilter requires an x-hh-token
# header on secured endpoints and returns 400 without it. Whitelist the agent
# endpoints (full-regex match on the request URI) so they can be called locally
# without obtaining an IAM token. Do NOT set this in qa/prod.
com.hwyhaul.security.ignored=/agent/.*

agent.omsr.mongo.enabled=true
agent.omsr.mongo.uri=mongodb://127.0.0.1:27017/ai_agent_config?replicaSet=rs0
agent.omsr.mongo.database=ai_agent_config
agent.omsr.mongo.collection=3p_rpa_config
agent.omsr.mongo.agent-id=omsr
agent.omsr.mongo.process-existing-on-startup=false
agent.omsr.mongo.mark-dispatched=true
agent.omsr.mongo.status-field=eventStatus
agent.omsr.mongo.event-store-enabled=true
agent.omsr.mongo.event-store-collection=3p_rpa_event_log
agent.omsr.mongo.processed-load-store-enabled=true
agent.omsr.mongo.processed-load-collection=3p_rpa_extracted_loads
agent.omsr.job.enabled=false
agent.omsr.job.initial-delay-ms=30000
# Quartz trigger interval for the OMSR load-creation agent. 900000 ms = 15 minutes.
agent.omsr.job.interval-ms=900000

# Load API integrations for local runs. These hit QA sentinel (same targets as
# the base profile); keep them explicit here so the local profile stays
# self-contained. For fully offline runs, blank the URLs to disable the calls.

# Load-existence validation: before creating, look up whether HwyHaul already
# has a load for the same customerLoadNumber + companyId and skip if so.
load.api.lookup-url=https://qa.sentinel.hwyhaul.com/core/hwyhaul/services/loads/lookup-by-customer-load-number
load.api.skip-if-exists=true

# Address resolution: resolve the HwyHaul address id from the address API
# instead of the configured default pickup/dropoff ids. Set enabled=false to
# skip the address-id API call (or blank the base-url) and use the defaults.
services.address.lookup.enabled=true
services.address.lookup.base-url=https://qa.sentinel.hwyhaul.com/core/hwyhaul
