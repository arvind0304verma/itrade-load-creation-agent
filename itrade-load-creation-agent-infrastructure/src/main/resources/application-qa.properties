agent.omsr.max-loads-from-first-screen=0
agent.omsr.headless=true
agent.omsr.debug-directory=target/playwright-debug/omsr
agent.omsr.run-timeout-ms=600000
agent.omsr.events.core-pool-size=1
agent.omsr.events.max-pool-size=2
agent.omsr.events.queue-capacity=25
agent.omsr.job.enabled=false
agent.omsr.job.initial-delay-ms=30000
agent.omsr.job.fixed-delay-ms=300000
agent.omsr.mongo.enabled=true
# Local MongoDB only. Start it with tools/mongodb/start-local-mongodb.ps1.
agent.omsr.mongo.uri=mongodb+srv://${CONFIG_MONGO_USERNAME}:${CONFIG_MONGO_PASSWORD}@${CONFIG_MONGO_HOST}/ai_agent_config?authSource=admin&tls=true&retryWrites=true&w=majority
agent.omsr.mongo.database=ai_agent_config
agent.omsr.mongo.collection=3p_rpa_config
