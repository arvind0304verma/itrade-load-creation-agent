# OMSR browser/scrape configuration. Set username/password through environment variables or a local override.
agent.omsr.auth-url=https://omsr.itradenetwork.com/loginv2
agent.omsr.orders-url=https://omsr.itradenetwork.com/app/enterprise?activity=LogisticsC_OrderStatus
agent.omsr.username=${OMSR_USERNAME:}
agent.omsr.password=${OMSR_PASSWORD:}
agent.omsr.user-name-selector=input[name='userName']
agent.omsr.password-selector=input[name='password']
agent.omsr.submit-selector=button[type='submit']
agent.omsr.logout-enabled=true
agent.omsr.logout-url=https://omsr.itradenetwork.com/logout
agent.omsr.logout-selector=a[href*='/logout' i], button[aria-label*='logout' i], [aria-label*='logout' i], [data-testid*='logout' i]
agent.omsr.logout-menu-selector=itn-user-headshot .mat-mdc-menu-trigger, itn-user-headshot [aria-haspopup='menu'], .itn-user-headshot
agent.omsr.load-row-selector=tbody tr, [role='row']
agent.omsr.load-link-selector=a, button, [role='link']
